<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم SEO</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js"></script>
  <script>if (!requireLicense()) throw new Error("redirect");</script>
</head>
<body>
  <!-- الشريط العلوي -->
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span> لوحة تحكم SEO
    </div>
    <div>
      <button class="ghost" onclick="logout()">تسجيل الخروج</button>
    </div>
  </header>

  <main class="container">
    
    <!-- 1. بطاقة كشط البيانات (Scrape) -->
    <div class="card">
      <div class="section-title">
        <h2>كشط بيانات السيو (Scrape)</h2>
      </div>
      <div class="row">
        <input id="scrapeUrlInput" type="url" placeholder="https://example.com" dir="ltr">
        <button id="scrapeBtn" class="primary">بدء الكشط</button>
      </div>
      <p id="scrapeMsg" class="msg"></p>
      
      <div id="scrapeResults" style="display: none; margin-top: 20px;">
        <div class="kv">
          <div class="k">العنوان (Title)</div>
          <div class="v" id="resTitle"></div>
          
          <div class="k">طول العنوان</div>
          <div class="v" id="resTitleLength"></div>
          
          <div class="k">الوصف (Meta Desc)</div>
          <div class="v" id="resDesc"></div>
          
          <div class="k">عنوان H1</div>
          <div class="v" id="resH1"></div>
          
          <div class="k">حالة الاستجابة</div>
          <div class="v" id="resStatus"></div>
        </div>
      </div>
    </div>

    <!-- 2. بطاقة الفحص التقني (Audit) -->
    <div class="card">
      <div class="section-title">
        <h2>الفحص التقني (Audit)</h2>
      </div>
      <div class="row">
        <input id="auditUrlInput" type="url" placeholder="https://example.com" dir="ltr">
        <button id="auditBtn" class="primary">بدء الفحص</button>
      </div>
      <p id="auditMsg" class="msg"></p>
      
      <div id="auditResults" style="display: none; margin-top: 20px;">
        <!-- سيتم حقن النتائج هنا عبر الجافاسكريبت -->
      </div>
    </div>

    <!-- 3. بطاقة التحليل المتقدم (Advanced Analysis) -->
    <div class="card">
      <div class="section-title">
        <h2>التحليل المتقدم (Advanced Analysis)</h2>
      </div>
      <div class="row">
        <input id="analyzeUrlInput" type="url" placeholder="https://example.com" dir="ltr">
        <button id="analyzeBtn" class="primary">تحليل عميق</button>
      </div>
      <p id="analyzeMsg" class="msg"></p>
      
      <div id="analyzeResults" style="display: none; margin-top: 20px;">
        <!-- سيتم حقن النتائج هنا عبر الجافاسكريبت -->
      </div>
    </div>

    <!-- 4. بطاقة البحث عن كلمات مفتاحية حقيقية -->
    <div class="card">
      <div class="section-title">
        <h2>البحث عن كلمات مفتاحية (Keywords Discovery)</h2>
      </div>
      <div class="row">
        <input id="kwSeedInput" type="text" placeholder="مثال: التسويق الرقمي / SEO / قهوة" dir="auto">
        <select id="kwLangSelect" style="padding: 12px; border-radius: 10px; background: var(--bg-soft); color: var(--text); border: 1px solid var(--border);">
          <option value="ar">عربي</option>
          <option value="en">English</option>
        </select>
        <button id="kwBtn" class="primary">اكتشاف</button>
      </div>
      <p id="kwMsg" class="msg"></p>
      
      <div id="kwResults" style="display: none; margin-top: 20px;">
        <!-- شريط الأدوات العلوي -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <p id="kwCount" style="margin: 0; color: var(--text-dim); font-size: 0.9rem;"></p>
          <button id="kwExportBtn" class="ghost" style="font-size: 0.85rem;">📥 تحميل كـ CSV</button>
        </div>

        <!-- أزرار التصنيف (Tabs) -->
        <div id="kwTabs" style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
          <button class="tab-btn active" data-filter="all">الكل</button>
          <button class="tab-btn" data-filter="buyers">نية شراء 🔥</button>
          <button class="tab-btn" data-filter="learners">نية تعلم 📚</button>
          <button class="tab-btn" data-filter="platforms">المنصات ⚙️</button>
          <button class="tab-btn" data-filter="longtail">طويلة الذيل 🎯</button>
        </div>
        
        <div id="kwListContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; max-height: 400px; overflow-y: auto; padding-right: 5px;">
          <!-- الكلمات ستظهر هنا -->
        </div>
      </div>
    </div>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
